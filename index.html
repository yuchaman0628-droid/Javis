<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Interactive HUD</title>
  <!-- AI視覚認識エンジン (TensorFlow.js & MobileNet) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #00f3ff;
    }

    /* Webカメラ映像（背景） */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.6) contrast(1.2);
      transform: scaleX(-1); /* 鏡像反転 */
    }

    /* HUDオーバーレイ */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.05) 0%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
    }

    /* ホログラムリング */
    .jarvis-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(0, 243, 255, 0.5);
      border-radius: 50%;
      animation: rotateClockwise 20s linear infinite;
    }

    .inner-ring {
      position: absolute;
      width: 75%;
      height: 75%;
      border: 3px solid transparent;
      border-top-color: #00f3ff;
      border-bottom-color: #00f3ff;
      border-radius: 50%;
      animation: rotateCounterClockwise 8s linear infinite;
      filter: drop-shadow(0 0 10px #00f3ff);
    }

    .core {
      position: absolute;
      width: 30%;
      height: 30%;
      background: radial-gradient(circle, #ffffff 0%, #00f3ff 60%, rgba(0, 243, 255, 0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 30px #00f3ff;
      animation: pulse 2s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }

    /* 光消去用クラス */
    .core.off {
      opacity: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    /* UI操作エリア */
    .ui-panel {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 90%;
      max-width: 600px;
    }

    .subtitles {
      background: rgba(2, 8, 19, 0.85);
      border: 1px solid #00f3ff;
      border-radius: 8px;
      padding: 12px 20px;
      width: 100%;
      text-align: center;
      font-size: 1.1rem;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      text-shadow: 0 0 5px #00f3ff;
    }

    .btn-talk {
      background: rgba(0, 243, 255, 0.15);
      border: 2px solid #00f3ff;
      color: #00f3ff;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn-talk:hover {
      background: #00f3ff;
      color: #020813;
      box-shadow: 0 0 25px #00f3ff;
    }

    /* 画面内WEB表示用オーバーレイ */
    .web-overlay {
      position: absolute;
      top: 5%;
      left: 5%;
      width: 90%;
      height: 65%;
      z-index: 10;
      background: rgba(2, 8, 19, 0.95);
      border: 2px solid #00f3ff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .web-header {
      height: 40px;
      background: rgba(0, 243, 255, 0.15);
      border-bottom: 1px solid #00f3ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      color: #00f3ff;
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .close-btn {
      background: transparent;
      border: 1px solid #00f3ff;
      color: #00f3ff;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: #00f3ff;
      color: #000;
    }

    .web-iframe {
      width: 100%;
      height: calc(100% - 40px);
      border: none;
      background: #fff;
    }

    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- カメラ映像 -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- HUDリング -->
  <div class="hud-overlay">
    <div class="jarvis-container">
      <div class="outer-ring"></div>
      <div class="inner-ring"></div>
      <div class="core" id="coreLight"></div>
    </div>
  </div>

  <!-- 画面内WEB表示用オーバーレイ -->
  <div class="web-overlay" id="webOverlay">
    <div class="web-header">
      <span>J.A.R.V.I.S. INFORMATION DISPLAY</span>
      <button class="close-btn" id="closeWebBtn" onclick="closeInScreen()">×</button>
    </div>
    <iframe class="web-iframe" id="webIframe" src="about:blank"></iframe>
  </div>

  <!-- 操作パネル -->
  <div class="ui-panel">
    <div class="subtitles" id="status">「音声起動」を押して「HEY JARVIS」と話しかけてください</div>
    <button class="btn-talk" id="talkBtn">音声起動</button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');
    const coreLight = document.getElementById('coreLight');
    const webOverlay = document.getElementById('webOverlay');
    const webIframe = document.getElementById('webIframe');

    let currentStream = null;
    let currentFacingMode = 'user';
    let isListening = false;
    let isSpeaking = false; // 音声合成発言中フラグ
    let aiVisionModel = null;

    // 録画用変数
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // ユーザー名の読み込み（localStorage）
    let userName = localStorage.getItem('jarvis_userName') || "";

    function getTitle() {
      return userName ? `${userName}様` : "サー";
    }

    // 画面上へのサイト表示機能
    function openInScreen(url) {
      webIframe.src = url;
      webOverlay.style.display = 'flex';
    }

    function closeInScreen() {
      webIframe.src = 'about:blank';
      webOverlay.style.display = 'none';
    }

    // デスクトップアクティブ通知の許可要求（効果音・ピコン音無音化設定）
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function sendActiveNotification(msg) {
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          new Notification("J.A.R.V.I.S. System", {
            body: msg,
            icon: "",
            silent: true // スマホ通知音の無音化
          });
        } catch (e) {}
      }
    }

    // AI視覚モデルの非同期事前ロード
    async function loadAIVision() {
      try {
        aiVisionModel = await mobilenet.load();
      } catch (e) {
        console.log("AI Vision Model loading...");
      }
    }
    loadAIVision();

    // 1. Webカメラ起動
    async function initCamera(facingMode = 'user') {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = { video: { facingMode: facingMode }, audio: false };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        currentFacingMode = facingMode;
        
        if (facingMode === 'user') {
          video.style.transform = 'scaleX(-1)';
        } else {
          video.style.transform = 'scaleX(1)';
        }
      } catch (err) {
        statusText.innerText = "カメラのアクセスまたは切り替えに失敗しました。";
      }
    }

    // 2. 音声認識設定（スマホのピコンピコン音対策済み）
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      talkBtn.addEventListener('click', () => {
        if (!isListening) {
          try {
            recognition.start();
            isListening = true;
            talkBtn.innerText = "システム待機中...";
            const greeting = userName ? `お帰りなさいませ、${userName}様。「HEY JARVIS」とお呼びください。` : "「HEY JARVIS」と呼んで指示を出してください";
            statusText.innerText = greeting;
          } catch (e) {}
        }
      });

      // 音声認識終了時：自分が喋っていない場合のみマイク再開（ループ音防止）
      recognition.onend = () => {
        if (isListening && !isSpeaking) {
          try { recognition.start(); } catch (e) {}
        }
      };

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const userSpeech = event.results[lastIndex][0].transcript.trim();
        statusText.innerText = `あなた: 「${userSpeech}」`;
        
        processCommand(userSpeech, recognition);
      };
    } else {
      talkBtn.disabled = true;
      statusText.innerText = "お使いのブラウザは音声認識に対応していません（Google Chrome推奨）。";
    }

    // 天気コード解析
    function parseWeatherCode(code) {
      if (code === 0) return "快晴";
      if (code <= 3) return "晴れ時々曇り";
      if (code <= 48) return "霧";
      if (code <= 67) return "雨";
      if (code <= 77) return "雪";
      if (code <= 82) return "大雨";
      return "荒天";
    }

    // 画面キャプチャ実行関数
    function takeScreenshot() {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      if (currentFacingMode === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const link = document.createElement('a');
      link.download = `jarvis_capture_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // 録画開始関数
    function startRecording() {
      if (isRecording || !currentStream) return false;
      recordedChunks = [];
      try {
        mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(currentStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `jarvis_recording_${Date.now()}.webm`;
        a.click();
      };

      mediaRecorder.start();
      isRecording = true;
      return true;
    }

    // 録画停止関数
    function stopRecording() {
      if (!isRecording || !mediaRecorder) return false;
      mediaRecorder.stop();
      isRecording = false;
      return true;
    }

    // 物体辞書＆用途データベース
    const objectDatabase = {
      "cellular telephone": { name: "スマートフォン", use: "通話や情報検索、アプリの実行や日常のコミュニケーションに使用します。" },
      "cell phone": { name: "スマートフォン", use: "連絡やインターネット閲覧、写真撮影などに使用する多機能端末です。" },
      "hand-held computer": { name: "モバイル端末", use: "情報閲覧や各種ツールの操作に使用します。" },
      "laptop": { name: "ノートパソコン", use: "仕事やプログラミング、文書作成、動画の視聴や編集に使用します。" },
      "desktop computer": { name: "デスクトップPC", use: "高度なデータ処理やゲーム、作業全般に使用します。" },
      "computer keyboard": { name: "キーボード", use: "PCやシステムへの文字入力やコマンドの送信に使用します。" },
      "mouse": { name: "マウス", use: "画面上のポインターを移動・クリック操作するために使用します。" },
      "cup": { name: "コップ", use: "水やコーヒーなどの液体を入れて飲むために使用します。" },
      "coffee mug": { name: "マグカップ", use: "温かい飲み物などを注いで味わうために使用します。" },
      "water bottle": { name: "ボトル・水筒", use: "水分補給のための液体を安全に持ち運ぶ容器です。" },
      "book": { name: "書籍・本", use: "読書や情報収集、学習のために使用します。" },
      "spectacles": { name: "眼鏡", use: "視力を補正して視界をクリアにするために装着します。" },
      "sunglasses": { name: "サングラス", use: "眩しさや紫外線から目を保護するために装着します。" },
      "pen": { name: "ペン", use: "紙やノートに文字・図を書き留めるために使用します。" },
      "digital watch": { name: "デジタル時計", use: "正確な時間を計測・確認するために使用します。" },
      "television": { name: "モニター・テレビ", use: "映像を表示して情報を視覚的に確認・鑑賞するために使用します。" }
    };

    // AIビジョンによる画面物体分析（「これ何？」対応）
    async function analyzeCurrentView() {
      statusText.innerText = "高精度ビジョンスキャンを実行中...";
      if (!aiVisionModel) {
        aiVisionModel = await mobilenet.load();
      }

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const predictions = await aiVisionModel.classify(canvas);

      if (predictions && predictions.length > 0) {
        const topPrediction = predictions[0].className.toLowerCase();
        let matched = null;

        for (let key in objectDatabase) {
          if (topPrediction.includes(key)) {
            matched = objectDatabase[key];
            break;
          }
        }

        if (matched) {
          return `スキャン完了。画面に写っているものは「${matched.name}」です。${matched.use}`;
        } else {
          const rawName = predictions[0].className.split(',')[0];
          return `視覚アナライズ完了。対象物は「${rawName}」と識別されました。状況や環境に合わせてご活用ください。`;
        }
      } else {
        return "申し訳ありません。画面の物体を明確に識別できませんでした。もう少し近づけてお試しください。";
      }
    }

    // 3. 音声コマンド解析と実行
    async function processCommand(input, recognition) {
      const text = input.toLowerCase();
      let reply = "";

      // 画面表示消去コマンド
      if (text.includes("画面消") || text.includes("画面閉") || text.includes("閉じて") || text.includes("非表示")) {
        closeInScreen();
        reply = `画面表示を終了いたしました、${getTitle()}。`;
      }
      // 「これ何？」画面画像AI解析コマンド
      else if (text.includes("これ何") || text.includes("これなに") || text.includes("これは何") || text.includes("映ってる") || text.includes("何が見える")) {
        try {
          reply = await analyzeCurrentView();
          reply += `、${getTitle()}。`;
        } catch (e) {
          reply = `解析エラーが発生しました。カメラの映像を確認してください、${getTitle()}。`;
        }
      }
      // 画面キャプチャ・スクショコマンド
      else if (text.includes("キャプチャ") || text.includes("スクショ") || text.includes("スクリーンショット") || text.includes("写真撮")) {
        takeScreenshot();
        reply = `画面のキャプチャを完了し、ファイルを保存いたしました、${getTitle()}。`;
      }
      // 録画開始・停止コマンド
      else if (text.includes("録画")) {
        if (text.includes("開始") || text.includes("して") || text.includes("スタート") || text.includes("とって")) {
          if (startRecording()) {
            reply = `ビデオ録画を開始いたしました、${getTitle()}。`;
          } else {
            reply = `既に録画が開始されているか、カメラが準備できていません、${getTitle()}。`;
          }
        } else if (text.includes("停止") || text.includes("ストップ") || text.includes("やめて") || text.includes("おわ") || text.includes("終了")) {
          if (stopRecording()) {
            reply = `録画を停止し、動画ファイルを保存いたしました、${getTitle()}。`;
          } else {
            reply = `現在録画は実行されていません、${getTitle()}。`;
          }
        }
      }
      // 名前の記憶登録機能
      else if (text.includes("名前は") || text.includes("呼んで")) {
        let nameMatch = text.match(/(?:名前は|と呼んで|呼んで)(.+?)(?:だよ|です|にして|でお願い|$)/);
        if (!nameMatch) {
          nameMatch = text.match(/僕の名前は(.+)/) || text.match(/(.+)と呼んで/);
        }
        if (nameMatch && nameMatch[1]) {
          const extractedName = nameMatch[1].replace(/僕の|私の|は|と/g, '').trim();
          if (extractedName) {
            userName = extractedName;
            localStorage.setItem('jarvis_userName', userName);
            reply = `承知いたしました。お名前を「${userName}」として登録いたしました。これよりは${userName}様とお呼びいたします。`;
          }
        }
        if (!reply) {
          reply = `お名前の確認ができませんでした。もう一度「僕の名前は〇〇だよ」とおっしゃってください。`;
        }
      }
      // バッテリー残量の確認
      else if (text.includes("充電") || text.includes("バッテリー") || text.includes("電池")) {
        if ('getBattery' in navigator) {
          try {
            const battery = await navigator.getBattery();
            const level = Math.round(battery.level * 100);
            const status = battery.charging ? "現在充電中です。" : "現在バッテリー駆動中です。";
            reply = `現在のデバイスのバッテリー残量は ${level}% です。${status}`;
          } catch (e) {
            reply = `バッテリー情報の取得に失敗しました、${getTitle()}。`;
          }
        } else {
          reply = `お使いのブラウザはバッテリー情報の取得に対応していません、${getTitle()}。`;
        }
      }
      // リアルタイム天気情報（Open-Meteo API使用）
      else if (text.includes("天気") || text.includes("予報")) {
        try {
          statusText.innerText = "リアルタイム天気を取得中...";
          const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&current_weather=true");
          const data = await response.json();
          const temp = Math.round(data.current_weather.temperature);
          const condition = parseWeatherCode(data.current_weather.weathercode);
          reply = `現在の気温は ${temp} 度、天気は ${condition} です、${getTitle()}。`;
        } catch (e) {
          reply = `リアルタイム天気の取得に失敗しました、${getTitle()}。`;
        }
      }
      // 外部Webサイトへのアクセス（画面上にインライン表示）
      else if (text.includes("開いて") || text.includes("アクセス")) {
        if (text.includes("youtube") || text.includes("ユーチューブ")) {
          openInScreen("https://www.youtube.com");
          reply = `YouTube を画面上に表示しました、${getTitle()}。`;
        } else if (text.includes("google") || text.includes("グーグル")) {
          openInScreen("https://www.google.com/search?igu=1");
          reply = `Google 検索画面を表示しました、${getTitle()}。`;
        } else if (text.includes("ニュース")) {
          openInScreen("https://news.google.com");
          reply = `最新ニュースを画面上に表示しました、${getTitle()}。`;
        } else {
          const target = text.replace(/(を開いて|にアクセスして|アクセス)/g, "").trim();
          openInScreen(`https://www.google.com/search?q=${encodeURIComponent(target)}&igu=1`);
          reply = `${target} の検索結果を画面上に表示しました、${getTitle()}。`;
        }
      }
      // 情報の引っ張り出し・検索（画面上にインライン表示）
      else if (text.includes("教えて") || text.includes("とは") || text.includes("調べて") || text.includes("検索")) {
        const query = text.replace(/(について教えて|とは|を調べて|で検索|を検索|教えて)/g, "").trim();
        if (query) {
          try {
            statusText.innerText = `外部データベースから「${query}」を検索中...`;
            const wikiRes = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
            if (wikiRes.ok) {
              const wikiData = await wikiRes.json();
              const summary = wikiData.extract ? wikiData.extract.substring(0, 80) : "";
              reply = `${query} についての情報です。${summary}... 画面上に詳細ページを表示します、${getTitle()}。`;
              openInScreen(wikiData.content_urls.desktop.page);
            } else {
              openInScreen(`https://www.google.com/search?q=${encodeURIComponent(query)}&igu=1`);
              reply = `${query} の検索結果を画面上に表示します、${getTitle()}。`;
            }
          } catch(e) {
            openInScreen(`https://www.google.com/search?q=${encodeURIComponent(query)}&igu=1`);
            reply = `${query} についての検索ページを画面上に表示しました、${getTitle()}。`;
          }
        }
      }
      // 時間の問い合わせ
      else if (text.includes("時間") || text.includes("今何時") || text.includes("時刻")) {
        const now = new Date();
        reply = `現在は${now.getHours()}時${now.getMinutes()}分です、${getTitle()}。`;
      } 
      // 日付の問い合わせ
      else if (text.includes("日") || text.includes("今日") || text.includes("日付") || text.includes("カレンダー")) {
        const now = new Date();
        const days = ["日", "月", "火", "水", "木", "金", "土"];
        reply = `本日は${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日、${days[now.getDay()]}曜日です、${getTitle()}。`;
      } 
      // カメラ切替操作
      else if (text.includes("カメラ")) {
        if (text.includes("イン") || text.includes("内") || text.includes("前")) {
          initCamera('user');
          reply = `インカメラに切り替えました、${getTitle()}。`;
        } else if (text.includes("アウト") || text.includes("外") || text.includes("リア") || text.includes("後ろ")) {
          initCamera('environment');
          reply = `アウトカメラに切り替えました、${getTitle()}。`;
        } else {
          const nextMode = currentFacingMode === 'user' ? 'environment' : 'user';
          initCamera(nextMode);
          reply = nextMode === 'user' ? `インカメラに切り替えました、${getTitle()}。` : `アウトカメラに切り替えました、${getTitle()}。`;
        }
      } 
      // 中央の光（コア）制御
      else if (text.includes("光") || text.includes("ライト") || text.includes("電気") || text.includes("コア")) {
        if (text.includes("消") || text.includes("オフ") || text.includes("切")) {
          coreLight.classList.add('off');
          reply = `中央コアの発光を停止しました、${getTitle()}。`;
        } else if (text.includes("つけ") || text.includes("オン") || text.includes("点")) {
          coreLight.classList.remove('off');
          reply = `中央コアの発光を再開しました、${getTitle()}。`;
        }
      } 
      // ウェイクワードまたは一般的な応答
      else if (text.includes("ヘイ") || text.includes("hey") || text.includes("ジャービス") || text.includes("javis") || text.includes("jarvis")) {
        if (text.includes("こんにちは")) {
          reply = `こんにちは、${getTitle()}。何かお手伝いできることはありますか？`;
        } else if (text.includes("状況") || text.includes("報告")) {
          reply = `システム正常。リアルタイムモニタリングを維持しています、${getTitle()}。`;
        } else {
          reply = `はい、${getTitle()}。何でしょうか？`;
        }
      }

      // 返答実行＆音声再生時のマイク制御（スマホ効果音完全防止）
      if (reply) {
        statusText.innerText = `J.A.R.V.I.S.: 「${reply}」`;
        sendActiveNotification(reply);

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(reply);
        utterance.lang = 'ja-JP';
        utterance.pitch = 0.85;
        utterance.rate = 1.0;

        // 読み上げ開始時にマイク認識を一旦ストップ（ピコン音防止）
        utterance.onstart = () => {
          isSpeaking = true;
          try { recognition.stop(); } catch(e) {}
        };

        // 読み上げ終了後にマイク認識を再開
        utterance.onend = () => {
          isSpeaking = false;
          if (isListening) {
            setTimeout(() => {
              try { recognition.start(); } catch(e) {}
            }, 300);
          }
        };

        utterance.onerror = () => {
          isSpeaking = false;
          if (isListening) {
            try { recognition.start(); } catch(e) {}
          }
        };

        window.speechSynthesis.speak(utterance);
      }
    }

    initCamera('user');
  </script>
</body>
</html>
