<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - PC Resource Monitor & Maintenance</title>
  <style>
    :root {
      --bg-color: #060913;
      --panel-bg: rgba(10, 25, 47, 0.7);
      --primary-color: #00f3ff;
      --alert-color: #ff0055;
      --text-color: #cbe3f7;
      --border-color: rgba(0, 243, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 80%),
        linear-gradient(0deg, rgba(0, 0, 0, 0.2) 1px, transparent 1px);
      background-size: 100% 100%, 100% 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary-color);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .voice-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #00ff66;
      box-shadow: 0 0 8px #00ff66;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card-title {
      font-size: 1.1rem;
      color: var(--primary-color);
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* メーター表示 */
    .meter-container {
      margin-bottom: 15px;
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 5px;
    }

    .meter-bar {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-color), #0077ff);
      transition: width 0.5s ease;
    }

    .meter-fill.high {
      background: linear-gradient(90deg, #ff9900, var(--alert-color));
    }

    /* PDFドロップゾーン */
    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 6px;
      padding: 30px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .drop-zone:hover {
      background: rgba(0, 243, 255, 0.05);
      border-color: var(--primary-color);
    }

    .summary-box {
      margin-top: 15px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      max-height: 120px;
      overflow-y: auto;
    }

    /* リスト項目 */
    .list-item {
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--primary-color);
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 0 4px 4px 0;
      font-size: 0.9rem;
    }

    .list-item.urgent {
      border-left-color: var(--alert-color);
      background: rgba(255, 0, 85, 0.05);
    }

    .btn {
      background: transparent;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--primary-color);
      color: var(--bg-color);
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>JARVIS SYSTEM CONTROL</h1>
    <div class="voice-status">
      <div class="status-dot"></div>
      <span id="voiceStatusText">音声認識・応答：常時ON</span>
    </div>
  </header>

  <div class="grid">
    <!-- 1. PCリソース監視＆メンテナンス -->
    <div class="card">
      <div class="card-title">
        リソース監視 & メンテナンス
        <button class="btn" style="font-size:0.7rem;" onclick="simulateHighLoad()">高負荷テスト</button>
      </div>
      <div class="meter-container">
        <div class="meter-label"><span>CPU 使用率</span><span id="cpuVal">24%</span></div>
        <div class="meter-bar"><div class="meter-fill" id="cpuFill" style="width: 24%;"></div></div>
      </div>
      <div class="meter-container">
        <div class="meter-label"><span>メモリ 使用率</span><span id="memVal">42%</span></div>
        <div class="meter-bar"><div class="meter-fill" id="memFill" style="width: 42%;"></div></div>
      </div>
      <p id="resourceMsg" style="font-size: 0.85rem; color: #88a0b5;">システム状態: 正常</p>
    </div>

    <!-- 2. PDF・論文自動要約 -->
    <div class="card">
      <div class="card-title">PDF / 論文要約エンジン</div>
      <div class="drop-zone" id="dropZone">
        PDFファイルをドラッグ＆ドロップ<br>
        <span style="font-size:0.75rem; color:#668099;">（即座に要約テキストを生成）</span>
        <input type="file" id="fileInput" accept=".pdf,.txt" style="display:none;">
      </div>
      <div class="summary-box" id="summaryOutput">ファイル待ち受け中...</div>
    </div>

    <!-- 3. 通知集約＆緊急フィルタ -->
    <div class="card">
      <div class="card-title">
        メッセージ＆SNS通知集約
        <button class="btn" style="font-size:0.7rem;" onclick="simulateIncomingNotice()">疑似通知受信</button>
      </div>
      <div id="noticeList">
        <div class="list-item">
          <strong>Twitter:</strong> 新しいフォロワーが追加されました（低優先度）
        </div>
      </div>
    </div>

    <!-- 4. 音声アイデア帳 -->
    <div class="card">
      <div class="card-title">
        ボイスメモ / アイデア帳
        <button class="btn" id="micBtn" onclick="toggleListening()">🎤 録音開始</button>
      </div>
      <p style="font-size: 0.8rem; margin-bottom: 10px; color: #7890a5;">
        「〇〇のアイデア」と喋ると自動的にアイデア帳へ追加されます。
      </p>
      <div id="ideaList">
        <div class="list-item">【サンプル】AIを活用したタスク自動化アプリのアイデア</div>
      </div>
    </div>
  </div>

  <script>
    // --- 音声合成 (Text-to-Speech) ---
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 前の音声をリセット
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.pitch = 0.9;
        uttr.rate = 1.0;
        window.speechSynthesis.speak(uttr);
      }
    }

    // --- 1. リソース監視（シミュレーション） ---
    let cpuUsage = 24;
    let memUsage = 42;
    let alertCooldown = false;

    setInterval(() => {
      // ゆるやかな変動
      cpuUsage = Math.min(100, Math.max(10, cpuUsage + Math.floor(Math.random() * 11) - 5));
      memUsage = Math.min(100, Math.max(20, memUsage + Math.floor(Math.random() * 7) - 3));

      updateMeters();
    }, 2000);

    function updateMeters() {
      document.getElementById('cpuVal').innerText = cpuUsage + '%';
      document.getElementById('memVal').innerText = memUsage + '%';

      const cpuFill = document.getElementById('cpuFill');
      const memFill = document.getElementById('memFill');

      cpuFill.style.width = cpuUsage + '%';
      memFill.style.width = memUsage + '%';

      if (cpuUsage > 80 || memUsage > 80) {
        cpuFill.classList.add('high');
        memFill.classList.add('high');
        document.getElementById('resourceMsg').innerText = '警告: リソース使用率が高すぎます';
        document.getElementById('resourceMsg').style.color = 'var(--alert-color)';

        if (!alertCooldown) {
          alertCooldown = true;
          speak("CPUまたはメモリの使用率が高くなっています。重いプロセスを終了しますか？");
          setTimeout(() => { alertCooldown = false; }, 15000); // 15秒間再発話防止
        }
      } else {
        cpuFill.classList.remove('high');
        memFill.classList.remove('high');
        document.getElementById('resourceMsg').innerText = 'システム状態: 正常';
        document.getElementById('resourceMsg').style.color = '#88a0b5';
      }
    }

    function simulateHighLoad() {
      cpuUsage = 88;
      memUsage = 92;
      updateMeters();
    }

    // --- 2. PDF/論文ドロップ＆要約 ---
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => e.preventDefault());

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      const files = e.dataTransfer.files;
      if (files.length > 0) handleFile(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      const summaryBox = document.getElementById('summaryOutput');
      summaryBox.innerText = `解析中: ${file.name}...`;
      
      setTimeout(() => {
        const mockSummary = `【要約通知】「${file.name}」の解析が完了しました。\n・主要テーマ: システム設計およびリソース管理の最適化\n・結論: 自動化アルゴリズムにより全体の処理効率が35%向上。`;
        summaryBox.innerText = mockSummary;
        speak(`${file.name} の要約テキストを生成しました。`);
      }, 1500);
    }

    // --- 3. 通知集約＆緊急通知 ---
    function simulateIncomingNotice() {
      const isUrgent = Math.random() > 0.4;
      const senders = ["田中", "佐藤", "プロジェクトリーダー", "クライアント"];
      const sender = senders[Math.floor(Math.random() * senders.length)];
      const noticeList = document.getElementById('noticeList');

      const div = document.createElement('div');
      div.className = `list-item ${isUrgent ? 'urgent' : ''}`;

      if (isUrgent) {
        div.innerHTML = `<strong>【緊急】Slack:</strong> ${sender}さんから緊急メッセージ「至急確認をお願いします」`;
        speak(`${sender}さんから緊急の連絡です。`);
      } else {
        div.innerHTML = `<strong>Mail:</strong> ${sender}さん「明日の会議資料について」`;
      }

      noticeList.prepend(div);
    }

    // --- 4. 音声入力（アイデア帳） ---
    let recognition;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const text = event.results[lastIndex][0].transcript.trim();

        if (text.includes("アイデア")) {
          addIdea(text);
        }
      };

      recognition.onend = () => {
        if (isListening) recognition.start(); // 常時ONを維持
      };
    }

    function toggleListening() {
      const btn = document.getElementById('micBtn');
      if (!recognition) {
        alert("お使いのブラウザは音声認識に対応していません。");
        return;
      }

      if (!isListening) {
        recognition.start();
        isListening = true;
        btn.innerText = "🛑 録音中...";
        btn.style.borderColor = "var(--alert-color)";
        speak("音声認識を開始しました。");
      } else {
        isListening = false;
        recognition.stop();
        btn.innerText = "🎤 録音開始";
        btn.style.borderColor = "var(--primary-color)";
      }
    }

    function addIdea(text) {
      const ideaList = document.getElementById('ideaList');
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerText = `【キャプチャ】${text}`;
      ideaList.prepend(div);
      speak("アイデア帳に保存しました。");
    }
  </script>
</body>
</html>
