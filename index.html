<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #020813;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      color: #00f3ff;
    }

    /* HUD全体のコンテナ */
    .jarvis-container {
      position: relative;
      width: 400px;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 外側の点線リング */
    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(0, 243, 255, 0.4);
      border-radius: 50%;
      animation: rotateClockwise 20s linear infinite;
    }

    /* 内側の回転リング */
    .inner-ring {
      position: absolute;
      width: 75%;
      height: 75%;
      border: 3px solid transparent;
      border-top-color: #00f3ff;
      border-bottom-color: #00f3ff;
      border-radius: 50%;
      animation: rotateCounterClockwise 8s linear infinite;
      filter: drop-shadow(0 0 10px #00f3ff);
    }

    /* 装飾用のアークリング */
    .arc-ring {
      position: absolute;
      width: 55%;
      height: 55%;
      border: 2px solid rgba(0, 243, 255, 0.2);
      border-left-color: #00f3ff;
      border-radius: 50%;
      animation: rotateClockwise 4s ease-in-out infinite;
    }

    /* 中央の発光コア */
    .core {
      position: absolute;
      width: 30%;
      height: 30%;
      background: radial-gradient(circle, #ffffff 0%, #00f3ff 60%, rgba(0, 243, 255, 0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 30px #00f3ff, 0 0 60px #00f3ff;
      animation: pulse 2s ease-in-out infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* テキスト表示 */
    .status-text {
      position: absolute;
      bottom: -60px;
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #00f3ff;
      animation: blink 1.5s infinite;
    }

    /* アニメーション定義 */
    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="jarvis-container">
    <div class="outer-ring"></div>
    <div class="inner-ring"></div>
    <div class="arc-ring"></div>
    <div class="core"></div>
    <div class="status-text">J.A.R.V.I.S. ONLINE</div>
  </div>

</body>
</html>
