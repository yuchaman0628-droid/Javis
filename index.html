<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Interactive HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #00f3ff;
    }

    /* Webカメラ映像（背景） */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.6) contrast(1.2);
      transform: scaleX(-1); /* 鏡像反転 */
    }

    /* HUDオーバーレイ */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.05) 0%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
    }

    /* ホログラムリング */
    .jarvis-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(0, 243, 255, 0.5);
      border-radius: 50%;
      animation: rotateClockwise 20s linear infinite;
    }

    .inner-ring {
      position: absolute;
      width: 75%;
      height: 75%;
      border: 3px solid transparent;
      border-top-color: #00f3ff;
      border-bottom-color: #00f3ff;
      border-radius: 50%;
      animation: rotateCounterClockwise 8s linear infinite;
      filter: drop-shadow(0 0 10px #00f3ff);
    }

    .core {
      position: absolute;
      width: 30%;
      height: 30%;
      background: radial-gradient(circle, #ffffff 0%, #00f3ff 60%, rgba(0, 243, 255, 0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 30px #00f3ff;
      animation: pulse 2s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }

    /* 光消去用クラス */
    .core.off {
      opacity: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    /* UI操作エリア */
    .ui-panel {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 90%;
      max-width: 600px;
    }

    .subtitles {
      background: rgba(2, 8, 19, 0.85);
      border: 1px solid #00f3ff;
      border-radius: 8px;
      padding: 12px 20px;
      width: 100%;
      text-align: center;
      font-size: 1.1rem;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      text-shadow: 0 0 5px #00f3ff;
    }

    .btn-talk {
      background: rgba(0, 243, 255, 0.15);
      border: 2px solid #00f3ff;
      color: #00f3ff;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn-talk:hover {
      background: #00f3ff;
      color: #020813;
      box-shadow: 0 0 25px #00f3ff;
    }

    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- カメラ映像 -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- HUDリング -->
  <div class="hud-overlay">
    <div class="jarvis-container">
      <div class="outer-ring"></div>
      <div class="inner-ring"></div>
      <div class="core" id="coreLight"></div>
    </div>
  </div>

  <!-- 操作パネル -->
  <div class="ui-panel">
    <div class="subtitles" id="status">「音声起動」を押して「HEY JARVIS」と話しかけてください</div>
    <button class="btn-talk" id="talkBtn">音声起動</button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');
    const coreLight = document.getElementById('coreLight');

    let currentStream = null;
    let currentFacingMode = 'user';
    let isListening = false;

    // ユーザー名の読み込み（localStorage）
    let userName = localStorage.getItem('jarvis_userName') || "";

    function getTitle() {
      return userName ? `${userName}様` : "サー";
    }

    // デスクトップアクティブ通知の許可要求
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function sendActiveNotification(msg) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("J.A.R.V.I.S. System", {
          body: msg,
          icon: ""
        });
      }
    }

    // 1. Webカメラ起動
    async function initCamera(facingMode = 'user') {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = { video: { facingMode: facingMode }, audio: false };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        currentFacingMode = facingMode;
        
        if (facingMode === 'user') {
          video.style.transform = 'scaleX(-1)';
        } else {
          video.style.transform = 'scaleX(1)';
        }
      } catch (err) {
        statusText.innerText = "カメラのアクセスまたは切り替えに失敗しました。";
      }
    }

    // 2. 音声認識設定
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      talkBtn.addEventListener('click', () => {
        if (!isListening) {
          try {
            recognition.start();
            isListening = true;
            talkBtn.innerText = "システム待機中...";
            const greeting = userName ? `お帰りなさいませ、${userName}様。「HEY JARVIS」とお呼びください。` : "「HEY JARVIS」と呼んで指示を出してください";
            statusText.innerText = greeting;
          } catch (e) {}
        }
      });

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch (e) {}
        }
      };

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const userSpeech = event.results[lastIndex][0].transcript.trim();
        statusText.innerText = `あなた: 「${userSpeech}」`;
        
        processCommand(userSpeech);
      };
    } else {
      talkBtn.disabled = true;
      statusText.innerText = "お使いのブラウザは音声認識に対応していません（Google Chrome推奨）。";
    }

    // 天気コードを日本語化する関数
    function parseWeatherCode(code) {
      if (code === 0) return "快晴";
      if (code <= 3) return "晴れ時々曇り";
      if (code <= 48) return "霧";
      if (code <= 67) return "雨";
      if (code <= 77) return "雪";
      if (code <= 82) return "大雨";
      return "荒天";
    }

    // 3. 音声コマンド解析と実行（非同期処理対応）
    async function processCommand(input) {
      const text = input.toLowerCase();
      let reply = "";

      // 名前の記憶登録機能
      if (text.includes("名前は") || text.includes("呼んで")) {
        let nameMatch = text.match(/(?:名前は|と呼んで|呼んで)(.+?)(?:だよ|です|にして|でお願い|$)/);
        if (!nameMatch) {
          nameMatch = text.match(/僕の名前は(.+)/) || text.match(/(.+)と呼んで/);
        }
        if (nameMatch && nameMatch[1]) {
          const extractedName = nameMatch[1].replace(/僕の|私の|は|と/g, '').trim();
          if (extractedName) {
            userName = extractedName;
            localStorage.setItem('jarvis_userName', userName);
            reply = `承知いたしました。お名前を「${userName}」として登録いたしました。これよりは${userName}様とお呼びいたします。`;
          }
        }
        if (!reply) {
          reply = `お名前の確認ができませんでした。もう一度「僕の名前は〇〇だよ」とおっしゃってください。`;
        }
      }
      // バッテリー残量の確認
      else if (text.includes("充電") || text.includes("バッテリー") || text.includes("電池")) {
        if ('getBattery' in navigator) {
          try {
            const battery = await navigator.getBattery();
            const level = Math.round(battery.level * 100);
            const status = battery.charging ? "現在充電中です。" : "現在バッテリー駆動中です。";
            reply = `現在のデバイスのバッテリー残量は ${level}% です。${status}`;
          } catch (e) {
            reply = `バッテリー情報の取得に失敗しました、${getTitle()}。`;
          }
        } else {
          reply = `お使いのブラウザはバッテリー情報の取得に対応していません、${getTitle()}。`;
        }
      }
      // リアルタイム天気情報（Open-Meteo API使用）
      else if (text.includes("天気") || text.includes("予報")) {
        try {
          statusText.innerText = "リアルタイム天気を取得中...";
          // デフォルト座標（東京）
          const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&current_weather=true");
          const data = await response.json();
          const temp = Math.round(data.current_weather.temperature);
          const condition = parseWeatherCode(data.current_weather.weathercode);
          reply = `現在の気温は ${temp} 度、天気は ${condition} です、${getTitle()}。`;
        } catch (e) {
          reply = `リアルタイム天気の取得に失敗しました、${getTitle()}。`;
        }
      }
      // 外部Webサイトへのアクセス・開き
      else if (text.includes("開いて") || text.includes("アクセス")) {
        if (text.includes("youtube") || text.includes("ユーチューブ")) {
          window.open("https://www.youtube.com", "_blank");
          reply = `YouTube を開きました、${getTitle()}。`;
        } else if (text.includes("google") || text.includes("グーグル")) {
          window.open("https://www.google.com", "_blank");
          reply = `Google 検索を開きました、${getTitle()}。`;
        } else if (text.includes("ニュース")) {
          window.open("https://news.google.com", "_blank");
          reply = `最新ニュースサイトを開きました、${getTitle()}。`;
        } else {
          const target = text.replace(/(を開いて|にアクセスして|アクセス)/g, "").trim();
          window.open(`https://www.google.com/search?q=${encodeURIComponent(target)}`, "_blank");
          reply = `${target} へのアクセス用に検索結果を開きました、${getTitle()}。`;
        }
      }
      // 情報の引っ張り出し・検索（Wikipedia API / Web検索）
      else if (text.includes("教えて") || text.includes("とは") || text.includes("調べて") || text.includes("検索")) {
        const query = text.replace(/(について教えて|とは|を調べて|で検索|を検索|教えて)/g, "").trim();
        if (query) {
          try {
            statusText.innerText = `外部データベースから「${query}」を検索中...`;
            const wikiRes = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
            if (wikiRes.ok) {
              const wikiData = await wikiRes.json();
              const summary = wikiData.extract ? wikiData.extract.substring(0, 80) : "";
              reply = `${query} について外部サイトから情報を取り出しました。${summary}... 画面にサイトを開きます、${getTitle()}。`;
              window.open(wikiData.content_urls.desktop.page, "_blank");
            } else {
              window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, "_blank");
              reply = `${query} についての外部WEBサイト検索結果を表示します、${getTitle()}。`;
            }
          } catch(e) {
            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, "_blank");
            reply = `${query} について外部サイトを開いて調査を開始しました、${getTitle()}。`;
          }
        }
      }
      // 時間の問い合わせ
      else if (text.includes("時間") || text.includes("今何時") || text.includes("時刻")) {
        const now = new Date();
        reply = `現在は${now.getHours()}時${now.getMinutes()}分です、${getTitle()}。`;
      } 
      // 日付の問い合わせ
      else if (text.includes("日") || text.includes("今日") || text.includes("日付") || text.includes("カレンダー")) {
        const now = new Date();
        const days = ["日", "月", "火", "水", "木", "金", "土"];
        reply = `本日は${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日、${days[now.getDay()]}曜日です、${getTitle()}。`;
      } 
      // カメラ切替操作
      else if (text.includes("カメラ")) {
        if (text.includes("イン") || text.includes("内") || text.includes("前")) {
          initCamera('user');
          reply = `インカメラに切り替えました、${getTitle()}。`;
        } else if (text.includes("アウト") || text.includes("外") || text.includes("リア") || text.includes("後ろ")) {
          initCamera('environment');
          reply = `アウトカメラに切り替えました、${getTitle()}。`;
        } else {
          const nextMode = currentFacingMode === 'user' ? 'environment' : 'user';
          initCamera(nextMode);
          reply = nextMode === 'user' ? `インカメラに切り替えました、${getTitle()}。` : `アウトカメラに切り替えました、${getTitle()}。`;
        }
      } 
      // 中央の光（コア）制御
      else if (text.includes("光") || text.includes("ライト") || text.includes("電気") || text.includes("コア")) {
        if (text.includes("消") || text.includes("オフ") || text.includes("切")) {
          coreLight.classList.add('off');
          reply = `中央コアの発光を停止しました、${getTitle()}。`;
        } else if (text.includes("つけ") || text.includes("オン") || text.includes("点")) {
          coreLight.classList.remove('off');
          reply = `中央コアの発光を再開しました、${getTitle()}。`;
        }
      } 
      // ウェイクワードまたは一般的な応答
      else if (text.includes("ヘイ") || text.includes("hey") || text.includes("ジャービス") || text.includes("javis") || text.includes("jarvis")) {
        if (text.includes("こんにちは")) {
          reply = `こんにちは、${getTitle()}。何かお手伝いできることはありますか？`;
        } else if (text.includes("状況") || text.includes("報告")) {
          reply = `システム正常。リアルタイムモニタリングを維持しています、${getTitle()}。`;
        } else {
          reply = `はい、${getTitle()}。何でしょうか？`;
        }
      }

      // 返答の実行・アクティブ通知
      if (reply) {
        statusText.innerText = `J.A.R.V.I.S.: 「${reply}」`;
        sendActiveNotification(reply); // アクティブデスクトップ通知を発信

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(reply);
        utterance.lang = 'ja-JP';
        utterance.pitch = 0.85;
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    initCamera('user');
  </script>
</body>
</html>
