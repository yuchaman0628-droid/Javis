<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Interactive HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #00f3ff;
    }

    /* Webカメラ映像（背景） */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.6) contrast(1.2);
      transform: scaleX(-1); /* 鏡像反転 */
    }

    /* HUDオーバーレイ */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.05) 0%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
    }

    /* ホログラムリング */
    .jarvis-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(0, 243, 255, 0.5);
      border-radius: 50%;
      animation: rotateClockwise 20s linear infinite;
    }

    .inner-ring {
      position: absolute;
      width: 75%;
      height: 75%;
      border: 3px solid transparent;
      border-top-color: #00f3ff;
      border-bottom-color: #00f3ff;
      border-radius: 50%;
      animation: rotateCounterClockwise 8s linear infinite;
      filter: drop-shadow(0 0 10px #00f3ff);
    }

    .core {
      position: absolute;
      width: 30%;
      height: 30%;
      background: radial-gradient(circle, #ffffff 0%, #00f3ff 60%, rgba(0, 243, 255, 0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 30px #00f3ff;
      animation: pulse 2s ease-in-out infinite;
    }

    /* UI操作エリア */
    .ui-panel {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 90%;
      max-width: 600px;
    }

    .subtitles {
      background: rgba(2, 8, 19, 0.85);
      border: 1px solid #00f3ff;
      border-radius: 8px;
      padding: 12px 20px;
      width: 100%;
      text-align: center;
      font-size: 1.1rem;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      text-shadow: 0 0 5px #00f3ff;
    }

    .btn-talk {
      background: rgba(0, 243, 255, 0.15);
      border: 2px solid #00f3ff;
      color: #00f3ff;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn-talk:hover {
      background: #00f3ff;
      color: #020813;
      box-shadow: 0 0 25px #00f3ff;
    }

    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div class="hud-overlay">
    <div class="jarvis-container">
      <div class="outer-ring"></div>
      <div class="inner-ring"></div>
      <div class="core"></div>
    </div>
  </div>

  <div class="ui-panel">
    <div class="subtitles" id="status">「音声起動」ボタンを押して話しかけてください</div>
    <button class="btn-talk" id="talkBtn">音声起動</button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');

    // 1. Webカメラ起動
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
      } catch (err) {
        statusText.innerText = "カメラのアクセスを許可してください。";
      }
    }

    // 2. 音声認識 & 応答
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;

      talkBtn.addEventListener('click', () => {
        try {
          recognition.start();
          statusText.innerText = "音声を入力中...";
        } catch (e) {
          // 既に起動中の場合
        }
      });

      recognition.onresult = (event) => {
        const userSpeech = event.results[0][0].transcript;
        statusText.innerText = `あなた: 「${userSpeech}」`;
        
        setTimeout(() => {
          respondJarvis(userSpeech);
        }, 500);
      };

      recognition.onerror = () => {
        statusText.innerText = "音声を認識できませんでした。もう一度試してください。";
      };
    } else {
      talkBtn.disabled = true;
      statusText.innerText = "お使いのブラウザは音声認識に対応していません（Google Chrome推奨）。";
    }

    // 3. J.A.R.V.I.S. 応答・音声合成（読み上げ）
    function respondJarvis(input) {
      let reply = "承知いたしました、サー。";

      if (input.includes("こんにちは") || input.includes("ジャービス")) {
        reply = "こんにちは、サー。システムはすべて正常に作動しています。";
      } else if (input.includes("状況") || input.includes("報告") || input.includes("視界")) {
        reply = "フロントカメラ正常。周辺環境のアナライズを維持しています。";
      } else if (input.includes("誰")) {
        reply = "私はJ.A.R.V.I.S.、あなたのAIアシスタントです。";
      } else if (input.includes("ありがとう")) {
        reply = "どういたしまして、サー。いつでもお申し付けください。";
      }

      statusText.innerText = `J.A.R.V.I.S.: 「${reply}」`;

      // 音声読み上げ
      const utterance = new SpeechSynthesisUtterance(reply);
      utterance.lang = 'ja-JP';
      utterance.pitch = 0.85; // 少し低めのトーン
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    initCamera();
  </script>
</body>
</html>
