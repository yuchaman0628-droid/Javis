<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Interactive HUD</title>
  <!-- AI視覚認識エンジン (TensorFlow.js & MobileNet) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #00f3ff;
    }

    /* Webカメラ映像（背景） */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.6) contrast(1.2);
      transform: scaleX(-1); /* 鏡像反転 */
    }

    /* HUDオーバーレイ */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.05) 0%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
    }

    /* ホログラムリング */
    .jarvis-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(0, 243, 255, 0.5);
      border-radius: 50%;
      animation: rotateClockwise 20s linear infinite;
    }

    .inner-ring {
      position: absolute;
      width: 75%;
      height: 75%;
      border: 3px solid transparent;
      border-top-color: #00f3ff;
      border-bottom-color: #00f3ff;
      border-radius: 50%;
      animation: rotateCounterClockwise 8s linear infinite;
      filter: drop-shadow(0 0 10px #00f3ff);
    }

    .core {
      position: absolute;
      width: 30%;
      height: 30%;
      background: radial-gradient(circle, #ffffff 0%, #00f3ff 60%, rgba(0, 243, 255, 0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 30px #00f3ff;
      animation: pulse 2s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }

    /* 初期状態で中央の光を消灯 */
    .core.off {
      opacity: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    /* UI操作エリア */
    .ui-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 90%;
      max-width: 600px;
    }

    .subtitles {
      background: rgba(2, 8, 19, 0.85);
      border: 1px solid #00f3ff;
      border-radius: 8px;
      padding: 12px 20px;
      width: 100%;
      text-align: center;
      font-size: 1.1rem;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      text-shadow: 0 0 5px #00f3ff;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-talk, .btn-sub {
      background: rgba(0, 243, 255, 0.15);
      border: 2px solid #00f3ff;
      color: #00f3ff;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn-talk:hover, .btn-sub:hover {
      background: #00f3ff;
      color: #020813;
      box-shadow: 0 0 25px #00f3ff;
    }

    /* 画面内WEB表示用オーバーレイ */
    .web-overlay {
      position: absolute;
      top: 5%;
      left: 5%;
      width: 90%;
      height: 65%;
      z-index: 10;
      background: rgba(2, 8, 19, 0.95);
      border: 2px solid #00f3ff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .web-header {
      height: 40px;
      background: rgba(0, 243, 255, 0.15);
      border-bottom: 1px solid #00f3ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      color: #00f3ff;
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .close-btn {
      background: transparent;
      border: 1px solid #00f3ff;
      color: #00f3ff;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: #00f3ff;
      color: #000;
    }

    .web-iframe {
      width: 100%;
      height: calc(100% - 40px);
      border: none;
      background: #fff;
    }

    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- カメラ映像 -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- HUDリング (コアの光は初期状態 off) -->
  <div class="hud-overlay">
    <div class="jarvis-container">
      <div class="outer-ring"></div>
      <div class="inner-ring"></div>
      <div class="core off" id="coreLight"></div>
    </div>
  </div>

  <!-- 画面内WEB表示用オーバーレイ -->
  <div class="web-overlay" id="webOverlay">
    <div class="web-header">
      <span>J.A.R.V.I.S. INFORMATION DISPLAY</span>
      <button class="close-btn" id="closeWebBtn" onclick="closeInScreen()">×</button>
    </div>
    <iframe class="web-iframe" id="webIframe" src="about:blank"></iframe>
  </div>

  <!-- 操作パネル -->
  <div class="ui-panel">
    <div class="subtitles" id="status">「音声起動」を押して「HEY JARVIS」と話しかけてください</div>
    <div class="btn-group">
      <button class="btn-talk" id="talkBtn">音声起動</button>
      <button class="btn-sub" id="voiceBtn" onclick="switchVoice()">音声変更</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');
    const coreLight = document.getElementById('coreLight');
    const webOverlay = document.getElementById('webOverlay');
    const webIframe = document.getElementById('webIframe');

    let currentStream = null;
    let currentFacingMode = 'user';
    let isListening = false;
    let isSpeaking = false;
    let aiVisionModel = null;
    let isTorchOn = false;

    // 録画用変数
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // ユーザー名の読み込み（localStorage）
    let userName = localStorage.getItem('jarvis_userName') || "";

    // 音声選択＆設定用変数
    let availableVoices = [];
    let currentVoiceIndex = 0;
    let speechPitch = 0.85;

    function getTitle() {
      return userName ? `${userName}様` : "サー";
    }

    // 音声リストの読み込み
    function initVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('ja') || v.lang.includes('JP'));
        if (availableVoices.length === 0) {
          availableVoices = window.speechSynthesis.getVoices();
        }
      }
    }
    initVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = initVoices;
    }

    // 音声切り替え機能
    function switchVoice() {
      if (availableVoices.length > 0) {
        currentVoiceIndex = (currentVoiceIndex + 1) % availableVoices.length;
        const voiceName = availableVoices[currentVoiceIndex].name;
        speakResponse(`音声を「${voiceName}」に変更いたしました、${getTitle()}。`);
      } else {
        speakResponse(`利用可能な音声エンジンが1つのみのため、音声を変更できません。`);
      }
    }

    // スマホライト（フラッシュライト）制御機能
    async function setTorch(enable) {
      if (!currentStream) return false;
      const track = currentStream.getVideoTracks()[0];
      if (!track) return false;

      try {
        const capabilities = track.getCapabilities();
        if (capabilities.torch) {
          await track.applyConstraints({
            advanced: [{ torch: enable }]
          });
          isTorchOn = enable;
          return true;
        }
      } catch (e) {}
      return false;
    }

    // 画面上へのサイト表示機能
    function openInScreen(url) {
      webIframe.src = url;
      webOverlay.style.display = 'flex';
    }

    function closeInScreen() {
      webIframe.src = 'about:blank';
      webOverlay.style.display = 'none';
    }

    // デスクトップアクティブ通知（無音化）
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function sendActiveNotification(msg) {
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          new Notification("J.A.R.V.I.S. System", {
            body: msg,
            silent: true
          });
        } catch (e) {}
      }
    }

    // AI視覚モデルロード
    async function loadAIVision() {
      try {
        aiVisionModel = await mobilenet.load();
      } catch (e) {}
    }
    loadAIVision();

    // 1. Webカメラ起動
    async function initCamera(facingMode = 'user') {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = { video: { facingMode: facingMode }, audio: false };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        currentFacingMode = facingMode;
        
        if (facingMode === 'user') {
          video.style.transform = 'scaleX(-1)';
        } else {
          video.style.transform = 'scaleX(1)';
        }
      } catch (err) {
        statusText.innerText = "カメラのアクセスまたは切り替えに失敗しました。";
      }
    }

    // 2. 音声認識設定
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      talkBtn.addEventListener('click', () => {
        if (!isListening) {
          try {
            recognition.start();
            isListening = true;
            talkBtn.innerText = "システム待機中...";
            const greeting = userName ? `お帰りなさいませ、${userName}様。「HEY JARVIS」とお呼びください。` : "「HEY JARVIS」と呼んで指示を出してください";
            statusText.innerText = greeting;
          } catch (e) {}
        }
      });

      recognition.onend = () => {
        if (isListening && !isSpeaking) {
          try { recognition.start(); } catch (e) {}
        }
      };

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const userSpeech = event.results[lastIndex][0].transcript.trim();
        processCommand(userSpeech, recognition);
      };
    } else {
      talkBtn.disabled = true;
      statusText.innerText = "お使いのブラウザは音声認識に対応していません。";
    }

    // 天気コード解析
    function parseWeatherCode(code) {
      if (code === 0) return "快晴";
      if (code <= 3) return "晴れ時々曇り";
      if (code <= 48) return "霧";
      if (code <= 67) return "雨";
      if (code <= 77) return "雪";
      if (code <= 82) return "大雨";
      return "荒天";
    }

    // キャプチャ
    function takeScreenshot() {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      if (currentFacingMode === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const link = document.createElement('a');
      link.download = `jarvis_capture_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // 録画制御
    function startRecording() {
      if (isRecording || !currentStream) return false;
      recordedChunks = [];
      try {
        mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(currentStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `jarvis_recording_${Date.now()}.webm`;
        a.click();
      };

      mediaRecorder.start();
      isRecording = true;
      return true;
    }

    function stopRecording() {
      if (!isRecording || !mediaRecorder) return false;
      mediaRecorder.stop();
      isRecording = false;
      return true;
    }

    // 拡張された多目的大規模物体辞書（カメラ検索機能の大幅強化）
    const expandedObjectDB = {
      // 日常用品・文房具・電子機器
      "cellular telephone": "スマートフォン", "cell phone": "スマートフォン", "mobile phone": "携帯電話",
      "laptop": "ノートパソコン", "desktop computer": "デスクトップPC", "computer keyboard": "キーボード",
      "mouse": "マウス", "remote control": "リモコン", "television": "テレビ・モニター",
      "cup": "コップ", "coffee mug": "マグカップ", "water bottle": "水筒・ペットボトル",
      "book": "書籍", "notebook": "ノート", "pen": "ペン・筆記用具", "pencil": "鉛筆",
      "spectacles": "眼鏡", "sunglasses": "サングラス", "digital watch": "時計", "clock": "時計",
      "headphone": "ヘッドホン", "earphone": "イヤホン", "wallet": "財布", "backpack": "リュック・鞄",
      "umbrella": "傘", "scissors": "ハサミ", "tissue": "ティッシュ",

      // 衣類・身の回り品
      "t-shirt": "Tシャツ", "jean": "ジーンズ", "shoe": "靴", "sneaker": "スニーカー",
      "cap": "帽子", "coat": "コート・上着", "glove": "手袋", "sock": "靴下",

      // 食品・飲み物
      "apple": "リンゴ", "banana": "バナナ", "orange": "オレンジ", "bread": "パン",
      "pizza": "ピザ", "sandwich": "サンドイッチ", "bottle": "ボトル", "plate": "お皿",

      // 家具・室内
      "chair": "椅子", "desk": "デスク・机", "table": "テーブル", "couch": "ソファ",
      "bed": "ベッド", "lamp": "照明・ランプ", "door": "ドア・扉", "window": "窓",

      // 動物・ペット
      "dog": "犬", "cat": "猫", "bird": "鳥", "fish": "魚", "rabbit": "ウサギ",
      "hamster": "ハムスター", "horse": "馬", "turtle": "カメ",

      // 乗り物
      "car": "自動車", "bicycle": "自転車", "motorcycle": "バイク", "bus": "バス",
      "train": "電車", "airplane": "飛行機"
    };

    // カメラ画像高度AI分析（「これ何？」で何でも多目的に識別）
    async function analyzeCurrentView() {
      if (!aiVisionModel) {
        aiVisionModel = await mobilenet.load();
      }

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const predictions = await aiVisionModel.classify(canvas, 5);

      if (predictions && predictions.length > 0) {
        let detectedItems = [];
        
        for (let p of predictions) {
          const rawName = p.className.toLowerCase();
          for (let key in expandedObjectDB) {
            if (rawName.includes(key)) {
              if (!detectedItems.includes(expandedObjectDB[key])) {
                detectedItems.push(expandedObjectDB[key]);
              }
            }
          }
        }

        if (detectedItems.length > 0) {
          return `スキャン完了。画面に写っているものは「${detectedItems.join('、または')}」の可能性が極めて高いです。`;
        } else {
          const firstName = predictions[0].className.split(',')[0];
          return `アナライズ完了。対象物は「${firstName}」系の物体として識別されました。`;
        }
      } else {
        return "申し訳ありません。対象物を明確に検出できませんでした。もう少し近づけるか正面に向けてお試しください。";
      }
    }

    // 音声発声処理（文字表示より先に音声で応答を開始）
    function speakResponse(replyText) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(replyText);
      
      if (availableVoices.length > 0) {
        utterance.voice = availableVoices[currentVoiceIndex] || null;
      }
      utterance.lang = 'ja-JP';
      utterance.pitch = speechPitch;
      utterance.rate = 1.0;

      // 音声再生開始と同時に（テキスト表示よりも先行して）文字更新と発声処理
      utterance.onstart = () => {
        statusText.innerText = `J.A.R.V.I.S.: 「${replyText}」`;
        sendActiveNotification(replyText);
        isSpeaking = true;
      };

      utterance.onend = () => {
        isSpeaking = false;
      };

      utterance.onerror = () => {
        isSpeaking = false;
      };

      // 即時に音声を発声開始
      window.speechSynthesis.speak(utterance);
    }

    // 3. 音声コマンド解析と実行
    async function processCommand(input, recognition) {
      const text = input.toLowerCase();
      let reply = "";

      // ライト（フラッシュライト）操作コマンド
      if (text.includes("ライト") || text.includes("フラッシュ")) {
        if (text.includes("つけ") || text.includes("オン") || text.includes("点灯") || text.includes("つけて")) {
          const success = await setTorch(true);
          reply = success ? `カメラのライトを点灯しました、${getTitle()}。` : `申し訳ありません。このカメラデバイスはライト点灯に対応していないか、インカメラが選択されています。`;
        } else if (text.includes("消") || text.includes("オフ") || text.includes("消して")) {
          await setTorch(false);
          reply = `ライトを消灯いたしました、${getTitle()}。`;
        }
      }
      // 声の変更・トーン操作コマンド
      else if (text.includes("声を変え") || text.includes("声変更") || text.includes("声をチェンジ")) {
        switchVoice();
        return;
      } else if (text.includes("声を高く")) {
        speechPitch = 1.2;
        reply = `音声を高めのトーンに変更いたしました、${getTitle()}。`;
      } else if (text.includes("声を低く")) {
        speechPitch = 0.6;
        reply = `音声を低めのトーンに変更いたしました、${getTitle()}。`;
      }
      // 画面表示消去コマンド
      else if (text.includes("画面消") || text.includes("画面閉") || text.includes("閉じて") || text.includes("非表示")) {
        closeInScreen();
        reply = `画面表示を終了いたしました、${getTitle()}。`;
      }
      // カメラ高度AI画像解析コマンド
      else if (text.includes("これ何") || text.includes("これなに") || text.includes("これは何") || text.includes("映ってる") || text.includes("何が見える") || text.includes("調べて")) {
        try {
          reply = await analyzeCurrentView();
          reply += ` ${getTitle()}。`;
        } catch (e) {
          reply = `解析中にエラーが発生しました、${getTitle()}。`;
        }
      }
      // キャプチャコマンド
      else if (text.includes("キャプチャ") || text.includes("スクショ") || text.includes("スクリーンショット") || text.includes("写真撮")) {
        takeScreenshot();
        reply = `画面のキャプチャを完了し、保存いたしました、${getTitle()}。`;
      }
      // 録画コマンド
      else if (text.includes("録画")) {
        if (text.includes("開始") || text.includes("して") || text.includes("スタート")) {
          if (startRecording()) {
            reply = `ビデオ録画を開始いたしました、${getTitle()}。`;
          } else {
            reply = `録画を開始できませんでした、${getTitle()}。`;
          }
        } else if (text.includes("停止") || text.includes("ストップ") || text.includes("終了")) {
          if (stopRecording()) {
            reply = `録画を停止し、ファイルを保存いたしました、${getTitle()}。`;
          } else {
            reply = `現在録画は実行されていません、${getTitle()}。`;
          }
        }
      }
      // 名前の登録
      else if (text.includes("名前は") || text.includes("呼んで")) {
        let nameMatch = text.match(/(?:名前は|と呼んで|呼んで)(.+?)(?:だよ|です|にして|でお願い|$)/);
        if (!nameMatch) {
          nameMatch = text.match(/僕の名前は(.+)/) || text.match(/(.+)と呼んで/);
        }
        if (nameMatch && nameMatch[1]) {
          const extractedName = nameMatch[1].replace(/僕の|私の|は|と/g, '').trim();
          if (extractedName) {
            userName = extractedName;
            localStorage.setItem('jarvis_userName', userName);
            reply = `承知いたしました。お名前を「${userName}」として登録いたしました。これよりは${userName}様とお呼びいたします。`;
          }
        }
        if (!reply) {
          reply = `お名前の確認ができませんでした。もう一度おっしゃってください。`;
        }
      }
      // バッテリー残量
      else if (text.includes("充電") || text.includes("バッテリー") || text.includes("電池")) {
        if ('getBattery' in navigator) {
          try {
            const battery = await navigator.getBattery();
            const level = Math.round(battery.level * 100);
            const status = battery.charging ? "現在充電中です。" : "現在バッテリー駆動中です。";
            reply = `現在のバッテリー残量は ${level}% です。${status}`;
          } catch (e) {
            reply = `バッテリー情報の取得に失敗しました、${getTitle()}。`;
          }
        } else {
          reply = `お使いのブラウザはバッテリー取得に対応していません、${getTitle()}。`;
        }
      }
      // 天気情報
      else if (text.includes("天気") || text.includes("予報")) {
        try {
          const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&current_weather=true");
          const data = await response.json();
          const temp = Math.round(data.current_weather.temperature);
          const condition = parseWeatherCode(data.current_weather.weathercode);
          reply = `現在の気温は ${temp} 度、天気は ${condition} です、${getTitle()}。`;
        } catch (e) {
          reply = `天気の取得に失敗しました、${getTitle()}。`;
        }
      }
      // Webアクセス
      else if (text.includes("開いて") || text.includes("アクセス")) {
        if (text.includes("youtube") || text.includes("ユーチューブ")) {
          openInScreen("https://www.youtube.com");
          reply = `YouTube を画面上に表示しました、${getTitle()}。`;
        } else if (text.includes("google") || text.includes("グーグル")) {
          openInScreen("https://www.google.com/search?igu=1");
          reply = `Google 検索画面を表示しました、${getTitle()}。`;
        } else if (text.includes("ニュース")) {
          openInScreen("https://news.google.com");
          reply = `最新ニュースを画面上に表示しました、${getTitle()}。`;
        } else {
          const target = text.replace(/(を開いて|にアクセスして|アクセス)/g, "").trim();
          openInScreen(`https://www.google.com/search?q=${encodeURIComponent(target)}&igu=1`);
          reply = `${target} の検索結果を画面上に表示しました、${getTitle()}。`;
        }
      }
      // 情報の検索
      else if (text.includes("教えて") || text.includes("とは") || text.includes("検索")) {
        const query = text.replace(/(について教えて|とは|で検索|を検索|教えて)/g, "").trim();
        if (query) {
          try {
            const wikiRes = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
            if (wikiRes.ok) {
              const wikiData = await wikiRes.json();
              const summary = wikiData.extract ? wikiData.extract.substring(0, 80) : "";
              reply = `${query} についての情報です。${summary}... 画面上に表示します、${getTitle()}。`;
              openInScreen(wikiData.content_urls.desktop.page);
            } else {
              openInScreen(`https://www.google.com/search?q=${encodeURIComponent(query)}&igu=1`);
              reply = `${query} の検索結果を画面上に表示します、${getTitle()}。`;
            }
          } catch(e) {
            openInScreen(`https://www.google.com/search?q=${encodeURIComponent(query)}&igu=1`);
            reply = `${query} の検索ページを画面上に表示しました、${getTitle()}。`;
          }
        }
      }
      // 時刻・日付
      else if (text.includes("時間") || text.includes("今何時") || text.includes("時刻")) {
        const now = new Date();
        reply = `現在は${now.getHours()}時${now.getMinutes()}分です、${getTitle()}。`;
      } else if (text.includes("日") || text.includes("今日") || text.includes("日付")) {
        const now = new Date();
        const days = ["日", "月", "火", "水", "木", "金", "土"];
        reply = `本日は${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日、${days[now.getDay()]}曜日です、${getTitle()}。`;
      } 
      // カメラ切替
      else if (text.includes("カメラ")) {
        if (text.includes("イン") || text.includes("内") || text.includes("前")) {
          initCamera('user');
          reply = `インカメラに切り替えました、${getTitle()}。`;
        } else if (text.includes("アウト") || text.includes("外") || text.includes("リア") || text.includes("後ろ")) {
          initCamera('environment');
          reply = `アウトカメラに切り替えました、${getTitle()}。`;
        } else {
          const nextMode = currentFacingMode === 'user' ? 'environment' : 'user';
          initCamera(nextMode);
          reply = nextMode === 'user' ? `インカメラに切り替えました、${getTitle()}。` : `アウトカメラに切り替えました、${getTitle()}。`;
        }
      } 
      // コアの光制御
      else if (text.includes("光") || text.includes("コア")) {
        if (text.includes("消") || text.includes("オフ") || text.includes("切")) {
          coreLight.classList.add('off');
          reply = `中央コアの発光を停止しました、${getTitle()}。`;
        } else if (text.includes("つけ") || text.includes("オン") || text.includes("点")) {
          coreLight.classList.remove('off');
          reply = `中央コアの発光を再開しました、${getTitle()}。`;
        }
      } 
      // 呼び出しコマンド
      else if (text.includes("ヘイ") || text.includes("hey") || text.includes("ジャービス") || text.includes("jarvis")) {
        if (text.includes("こんにちは")) {
          reply = `こんにちは、${getTitle()}。何かお手伝いできることはありますか？`;
        } else {
          reply = `はい、${getTitle()}。何でしょうか？`;
        }
      }

      // 返答の実行（文字表示より先に音声発声を開始）
      if (reply) {
        speakResponse(reply);
      }
    }

    initCamera('user');
  </script>
</body>
</html>
