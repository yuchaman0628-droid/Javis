<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Interactive HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #00f3ff;
    }

    /* Webカメラ映像（背景） */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.6) contrast(1.2);
      transform: scaleX(-1); /* 鏡像反転 */
    }

    /* HUDオーバーレイ */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.05) 0%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
    }

    /* ホログラムリング */
    .jarvis-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(0, 243, 255, 0.5);
      border-radius: 50%;
      animation: rotateClockwise 20s linear infinite;
    }

    .inner-ring {
      position: absolute;
      width: 75%;
      height: 75%;
      border: 3px solid transparent;
      border-top-color: #00f3ff;
      border-bottom-color: #00f3ff;
      border-radius: 50%;
      animation: rotateCounterClockwise 8s linear infinite;
      filter: drop-shadow(0 0 10px #00f3ff);
    }

    .core {
      position: absolute;
      width: 30%;
      height: 30%;
      background: radial-gradient(circle, #ffffff 0%, #00f3ff 60%, rgba(0, 243, 255, 0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 30px #00f3ff;
      animation: pulse 2s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }

    /* 光消去用クラス */
    .core.off {
      opacity: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    /* UI操作エリア */
    .ui-panel {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 90%;
      max-width: 600px;
    }

    .subtitles {
      background: rgba(2, 8, 19, 0.85);
      border: 1px solid #00f3ff;
      border-radius: 8px;
      padding: 12px 20px;
      width: 100%;
      text-align: center;
      font-size: 1.1rem;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      text-shadow: 0 0 5px #00f3ff;
    }

    .btn-talk {
      background: rgba(0, 243, 255, 0.15);
      border: 2px solid #00f3ff;
      color: #00f3ff;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn-talk:hover {
      background: #00f3ff;
      color: #020813;
      box-shadow: 0 0 25px #00f3ff;
    }

    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div class="hud-overlay">
    <div class="jarvis-container">
      <div class="outer-ring"></div>
      <div class="inner-ring"></div>
      <div class="core" id="coreLight"></div>
    </div>
  </div>

  <div class="ui-panel">
    <div class="subtitles" id="status">「音声起動」を押して「HEY JARVIS」と話しかけてください</div>
    <button class="btn-talk" id="talkBtn">音声起動</button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');
    const coreLight = document.getElementById('coreLight');

    let currentStream = null;
    let currentFacingMode = 'user'; // 'user'=インカメ, 'environment'=アウトカメラ
    let isListening = false;

    // 1. Webカメラ起動（イン・アウト制御付き）
    async function initCamera(facingMode = 'user') {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = { video: { facingMode: facingMode }, audio: false };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        currentFacingMode = facingMode;
        
        // インカメのみ左右反転
        if (facingMode === 'user') {
          video.style.transform = 'scaleX(-1)';
        } else {
          video.style.transform = 'scaleX(1)';
        }
      } catch (err) {
        statusText.innerText = "カメラの切り替えに失敗しました。";
      }
    }

    // 2. 常時聞き取り音声認識 & 応答
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true; // 常時聞き取りを有効化
      recognition.interimResults = false;

      talkBtn.addEventListener('click', () => {
        if (!isListening) {
          try {
            recognition.start();
            isListening = true;
            talkBtn.innerText = "システム待機中...";
            statusText.innerText = "「HEY JARVIS」と呼んで指示を出してください";
          } catch (e) {}
        }
      });

      // 認識が切れたら自動再起動してウェイクワード待機を維持
      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch (e) {}
        }
      };

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const userSpeech = event.results[lastIndex][0].transcript.trim();
        statusText.innerText = `あなた: 「${userSpeech}」`;
        
        processCommand(userSpeech);
      };
    } else {
      talkBtn.disabled = true;
      statusText.innerText = "お使いのブラウザは音声認識に対応していません（Google Chrome推奨）。";
    }

    // 3. 音声コマンド解析と実行
    function processCommand(input) {
      const text = input.toLowerCase();
      let reply = "";

      // 時間の問い合わせ
      if (text.includes("時間") || text.includes("今何時") || text.includes("時刻")) {
        const now = new Date();
        reply = `現在は${now.getHours()}時${now.getMinutes()}分です、サー。`;
      } 
      // 日付の問い合わせ
      else if (text.includes("日") || text.includes("今日") || text.includes("日付") || text.includes("カレンダー")) {
        const now = new Date();
        const days = ["日", "月", "火", "水", "木", "金", "土"];
        reply = `本日は${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日、${days[now.getDay()]}曜日です、サー。`;
      } 
      // カメラ切替操作
      else if (text.includes("カメラ")) {
        if (text.includes("イン") || text.includes("内") || text.includes("前")) {
          initCamera('user');
          reply = "インカメラに切り替えました、サー。";
        } else if (text.includes("アウト") || text.includes("外") || text.includes("リア") || text.includes("後ろ")) {
          initCamera('environment');
          reply = "アウトカメラに切り替えました、サー。";
        } else {
          const nextMode = currentFacingMode === 'user' ? 'environment' : 'user';
          initCamera(nextMode);
          reply = nextMode === 'user' ? "インカメラに切り替えました、サー。" : "アウトカメラに切り替えました、サー。";
        }
      } 
      // 中央の光（コア）制御
      else if (text.includes("光") || text.includes("ライト") || text.includes("電気") || text.includes("コア")) {
        if (text.includes("消") || text.includes("オフ") || text.includes("切")) {
          coreLight.classList.add('off');
          reply = "中央コアの発光を停止しました、サー。";
        } else if (text.includes("つけ") || text.includes("オン") || text.includes("点")) {
          coreLight.classList.remove('off');
          reply = "中央コアの発光を再開しました、サー。";
        }
      } 
      // ウェイクワードまたは一般的な応答
      else if (text.includes("ヘイ") || text.includes("hey") || text.includes("ジャービス") || text.includes("javis") || text.includes("jarvis")) {
        if (text.includes("こんにちは")) {
          reply = "こんにちは、サー。何かお手伝いできることはありますか？";
        } else if (text.includes("状況") || text.includes("報告")) {
          reply = "システム正常。周辺のリアルタイムモニタリングを維持しています。";
        } else {
          reply = "はい、サー。何でしょうか？";
        }
      }

      // 返答の実行
      if (reply) {
        statusText.innerText = `J.A.R.V.I.S.: 「${reply}」`;
        window.speechSynthesis.cancel(); // 直前の音声をカットして即応
        const utterance = new SpeechSynthesisUtterance(reply);
        utterance.lang = 'ja-JP';
        utterance.pitch = 0.85;
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    initCamera('user');
  </script>
</body>
</html>
