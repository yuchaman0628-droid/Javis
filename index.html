<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Interactive HUD System</title>
  <!-- AI視覚認識エンジン (TensorFlow.js & MobileNet) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #00f3ff;
    }

    /* タイトル画面（デバイス選択画面） */
    .title-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #020d1a 0%, #000000 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      padding: 20px;
      text-align: center;
    }

    .title-header h1 {
      font-size: 2.2rem;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #00f3ff;
      margin-bottom: 8px;
    }

    .title-header p {
      font-size: 0.95rem;
      color: rgba(0, 243, 255, 0.7);
      letter-spacing: 1px;
    }

    .device-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px;
    }

    .btn-device {
      background: rgba(0, 243, 255, 0.1);
      border: 2px solid #00f3ff;
      color: #00f3ff;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      min-width: 130px;
    }

    .btn-device:hover {
      background: #00f3ff;
      color: #000;
      box-shadow: 0 0 25px #00f3ff;
    }

    .title-voice-hint {
      font-size: 0.9rem;
      color: #00f3ff;
      border: 1px dashed #00f3ff;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(0, 243, 255, 0.05);
    }

    /* Webカメラ映像（背景） */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.6) contrast(1.2);
      transform: scaleX(-1);
    }

    /* HUDオーバーレイ */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.05) 0%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
    }

    .jarvis-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(0, 243, 255, 0.5);
      border-radius: 50%;
      animation: rotateClockwise 20s linear infinite;
    }

    .inner-ring {
      position: absolute;
      width: 75%;
      height: 75%;
      border: 3px solid transparent;
      border-top-color: #00f3ff;
      border-bottom-color: #00f3ff;
      border-radius: 50%;
      animation: rotateCounterClockwise 8s linear infinite;
      filter: drop-shadow(0 0 10px #00f3ff);
    }

    .core {
      position: absolute;
      width: 30%;
      height: 30%;
      background: radial-gradient(circle, #ffffff 0%, #00f3ff 60%, rgba(0, 243, 255, 0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 30px #00f3ff;
      animation: pulse 2s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }

    /* 初期状態：中央の光を消灯 */
    .core.off {
      opacity: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    /* UI操作エリア */
    .ui-panel {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 90%;
      max-width: 650px;
    }

    .subtitles {
      background: rgba(2, 8, 19, 0.85);
      border: 1px solid #00f3ff;
      border-radius: 8px;
      padding: 12px 20px;
      width: 100%;
      text-align: center;
      font-size: 1.05rem;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      text-shadow: 0 0 5px #00f3ff;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-talk, .btn-sub {
      background: rgba(0, 243, 255, 0.15);
      border: 2px solid #00f3ff;
      color: #00f3ff;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1.2px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .btn-talk:hover, .btn-sub:hover {
      background: #00f3ff;
      color: #020813;
      box-shadow: 0 0 20px #00f3ff;
    }

    /* 画面内オーバーレイ（WEB表示＆ファイル表示兼用） */
    .web-overlay {
      position: absolute;
      top: 5%;
      left: 5%;
      width: 90%;
      height: 65%;
      z-index: 10;
      background: rgba(2, 8, 19, 0.95);
      border: 2px solid #00f3ff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .web-header {
      height: 40px;
      background: rgba(0, 243, 255, 0.15);
      border-bottom: 1px solid #00f3ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      color: #00f3ff;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .close-btn {
      background: transparent;
      border: 1px solid #00f3ff;
      color: #00f3ff;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: #00f3ff;
      color: #000;
    }

    .web-iframe, .file-viewer {
      width: 100%;
      height: calc(100% - 40px);
      border: none;
      background: #fff;
    }

    .file-viewer {
      background: #05101a;
      color: #00f3ff;
      padding: 15px;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .file-viewer img, .file-viewer video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .file-viewer pre {
      white-space: pre-wrap;
      word-break: break-all;
      width: 100%;
      height: 100%;
    }

    /* 非表示ファイルインプット */
    #fileInput {
      display: none;
    }

    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- タイトル画面（デバイス選択） -->
  <div class="title-screen" id="titleScreen">
    <div class="title-header">
      <h1>J.A.R.V.I.S. SYSTEM</h1>
      <p>SELECT YOUR INITIAL DEVICE INTERFACE</p>
    </div>
    <div class="device-buttons">
      <button class="btn-device" onclick="selectDevice('スマホ')">スマホ</button>
      <button class="btn-device" onclick="selectDevice('タブレット')">タブレット</button>
      <button class="btn-device" onclick="selectDevice('PC')">PC</button>
    </div>
    <div class="title-voice-hint">
      🎙️ 音声コマンド待機中: 「スマホ」「タブレット」「PC」と話しかけて起動可能
    </div>
  </div>

  <!-- Webカメラ映像 -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- HUDリング (コアの光は初期状態 off) -->
  <div class="hud-overlay">
    <div class="jarvis-container">
      <div class="outer-ring"></div>
      <div class="inner-ring"></div>
      <div class="core off" id="coreLight"></div>
    </div>
  </div>

  <!-- 画面内WEB＆ファイル表示用オーバーレイ -->
  <div class="web-overlay" id="webOverlay">
    <div class="web-header">
      <span id="overlayTitle">J.A.R.V.I.S. INFORMATION DISPLAY</span>
      <button class="close-btn" onclick="closeInScreen()">×</button>
    </div>
    <iframe class="web-iframe" id="webIframe" src="about:blank"></iframe>
    <div class="file-viewer" id="fileViewer" style="display: none;"></div>
  </div>

  <!-- ファイル選択用非表示インプット -->
  <input type="file" id="fileInput" onchange="handleFileSelect(event)">

  <!-- 操作パネル -->
  <div class="ui-panel">
    <div class="subtitles" id="status">「音声起動」を押して「HEY JARVIS」と話しかけてください</div>
    <div class="btn-group">
      <button class="btn-talk" id="talkBtn">音声起動</button>
      <button class="btn-sub" onclick="triggerFileInput()">ファイル選択</button>
      <button class="btn-sub" onclick="switchVoice()">音声変更</button>
    </div>
  </div>

  <script>
    const titleScreen = document.getElementById('titleScreen');
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');
    const coreLight = document.getElementById('coreLight');
    const webOverlay = document.getElementById('webOverlay');
    const webIframe = document.getElementById('webIframe');
    const fileViewer = document.getElementById('fileViewer');
    const overlayTitle = document.getElementById('overlayTitle');
    const fileInput = document.getElementById('fileInput');

    let selectedDeviceType = "PC";
    let currentStream = null;
    let currentFacingMode = 'user';
    let isListening = false;
    let isSpeaking = false;
    let recognition = null;
    let restartTimer = null;
    let aiVisionModel = null;
    let isTorchOn = false;

    // 録画用
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // ユーザー名
    let userName = localStorage.getItem('jarvis_userName') || "";

    // 音声設定
    let availableVoices = [];
    let currentVoiceIndex = 0;
    let speechPitch = 0.85;

    function getTitle() {
      return userName ? `${userName}様` : "サー";
    }

    // 音声リスト読み込み
    function initVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('ja') || v.lang.includes('JP'));
        if (availableVoices.length === 0) {
          availableVoices = window.speechSynthesis.getVoices();
        }
      }
    }
    initVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = initVoices;
    }

    // 音声切り替え
    function switchVoice() {
      if (availableVoices.length > 0) {
        currentVoiceIndex = (currentVoiceIndex + 1) % availableVoices.length;
        const voiceName = availableVoices[currentVoiceIndex].name;
        speakResponse(`音声を「${voiceName}」に変更いたしました、${getTitle()}。`);
      } else {
        speakResponse(`利用可能な音声エンジンが1つのみのため変更できません。`);
      }
    }

    // デバイス選択処理（画面タップ・音声共通）
    function selectDevice(deviceType) {
      selectedDeviceType = deviceType;
      titleScreen.style.display = 'none';
      
      const defaultCamera = (deviceType === 'スマホ') ? 'environment' : 'user';
      initCamera(defaultCamera);

      const msg = `${deviceType}モードでシステムを初期化いたしました。お帰りなさいませ、${getTitle()}。「HEY JARVIS」とお呼びください。`;
      speakResponse(msg);
    }

    // スマホライト制御
    async function setTorch(enable) {
      if (!currentStream) return false;
      const track = currentStream.getVideoTracks()[0];
      if (!track) return false;

      try {
        const capabilities = track.getCapabilities();
        if (capabilities.torch) {
          await track.applyConstraints({ advanced: [{ torch: enable }] });
          isTorchOn = enable;
          return true;
        }
      } catch (e) {}
      return false;
    }

    // 画面内表示・消去
    function openInScreen(url) {
      fileViewer.style.display = 'none';
      webIframe.style.display = 'block';
      webIframe.src = url;
      overlayTitle.innerText = "J.A.R.V.I.S. INFORMATION DISPLAY";
      webOverlay.style.display = 'flex';
    }

    function closeInScreen() {
      webIframe.src = 'about:blank';
      fileViewer.innerHTML = '';
      webOverlay.style.display = 'none';
    }

    // ファイル閲覧機能
    function triggerFileInput() {
      fileInput.click();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      fileViewer.innerHTML = '';
      webIframe.style.display = 'none';
      fileViewer.style.display = 'flex';
      overlayTitle.innerText = `FILE: ${file.name}`;

      const fileURL = URL.createObjectURL(file);

      if (file.type.startsWith('image/')) {
        const img = document.createElement('img');
        img.src = fileURL;
        fileViewer.appendChild(img);
      } else if (file.type.startsWith('video/')) {
        const videoElem = document.createElement('video');
        videoElem.src = fileURL;
        videoElem.controls = true;
        videoElem.autoplay = true;
        fileViewer.appendChild(videoElem);
      } else if (file.type.startsWith('text/')) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const pre = document.createElement('pre');
          pre.textContent = e.target.result;
          fileViewer.appendChild(pre);
        };
        reader.readAsText(file);
      } else {
        const iframe = document.createElement('iframe');
        iframe.src = fileURL;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        fileViewer.appendChild(iframe);
      }

      webOverlay.style.display = 'flex';
      speakResponse(`ファイル「${file.name}」を画面上に展開いたしました、${getTitle()}。`);
    }

    // 通知（無音化）
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function sendActiveNotification(msg) {
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          new Notification("J.A.R.V.I.S. System", { body: msg, silent: true });
        } catch (e) {}
      }
    }

    // AI視覚モデルロード
    async function loadAIVision() {
      try { aiVisionModel = await mobilenet.load(); } catch (e) {}
    }
    loadAIVision();

    // 1. Webカメラ起動
    async function initCamera(facingMode = 'user') {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = { video: { facingMode: facingMode }, audio: false };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        currentFacingMode = facingMode;
        
        video.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
      } catch (err) {
        statusText.innerText = "カメラのアクセスまたは切り替えに失敗しました。";
      }
    }

    // 2. 音声認識（ピコン音防止・自動復旧型）
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      function startListeningSafely() {
        if (!isListening) return;
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          if (!isSpeaking) {
            try { recognition.start(); } catch (e) {}
          }
        }, 400); // 連続再起動を防止してピコン音解消
      }

      talkBtn.addEventListener('click', () => {
        if (!isListening) {
          isListening = true;
          talkBtn.innerText = "システム待機中...";
          statusText.innerText = "音声認識を起動しました。「HEY JARVIS」とお呼びください。";
          startListeningSafely();
        }
      });

      recognition.onend = () => {
        if (isListening && !isSpeaking) {
          startListeningSafely();
        }
      };

      recognition.onerror = (e) => {
        if (isListening && !isSpeaking) {
          startListeningSafely();
        }
      };

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const userSpeech = event.results[lastIndex][0].transcript.trim();
        processCommand(userSpeech);
      };

      // 起動直後から音声認識をバックグラウンド待機（タイトル画面での音声選択用）
      try {
        isListening = true;
        recognition.start();
      } catch(e) {}
    } else {
      talkBtn.disabled = true;
      statusText.innerText = "お使いのブラウザは音声認識に対応していません。";
    }

    // 天気解析
    function parseWeatherCode(code) {
      if (code === 0) return "快晴";
      if (code <= 3) return "晴れ時々曇り";
      if (code <= 48) return "霧";
      if (code <= 67) return "雨";
      if (code <= 77) return "雪";
      if (code <= 82) return "大雨";
      return "荒天";
    }

    // キャプチャ
    function takeScreenshot() {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      if (currentFacingMode === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const link = document.createElement('a');
      link.download = `jarvis_capture_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // 録画
    function startRecording() {
      if (isRecording || !currentStream) return false;
      recordedChunks = [];
      try { mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' }); } 
      catch (e) { mediaRecorder = new MediaRecorder(currentStream); }

      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `jarvis_recording_${Date.now()}.webm`;
        a.click();
      };

      mediaRecorder.start();
      isRecording = true;
      return true;
    }

    function stopRecording() {
      if (!isRecording || !mediaRecorder) return false;
      mediaRecorder.stop();
      isRecording = false;
      return true;
    }

    // カメラ広範オブジェクト辞書
    const expandedObjectDB = {
      "cellular telephone": "スマートフォン", "cell phone": "スマートフォン", "mobile phone": "携帯電話",
      "laptop": "ノートパソコン", "desktop computer": "デスクトップPC", "computer keyboard": "キーボード",
      "mouse": "マウス", "remote control": "リモコン", "television": "テレビ・モニター",
      "cup": "コップ", "coffee mug": "マグカップ", "water bottle": "水筒・ペットボトル",
      "book": "書籍", "notebook": "ノート", "pen": "ペン・筆記用具", "pencil": "鉛筆",
      "spectacles": "眼鏡", "sunglasses": "サングラス", "digital watch": "時計", "clock": "時計",
      "headphone": "ヘッドホン", "earphone": "イヤホン", "wallet": "財布", "backpack": "リュック・鞄",
      "umbrella": "傘", "scissors": "ハサミ", "tissue": "ティッシュ", "chair": "椅子", "desk": "デスク",
      "dog": "犬", "cat": "猫", "car": "自動車", "bicycle": "自転車"
    };

    async function analyzeCurrentView() {
      if (!aiVisionModel) aiVisionModel = await mobilenet.load();

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const predictions = await aiVisionModel.classify(canvas, 5);

      if (predictions && predictions.length > 0) {
        let detectedItems = [];
        for (let p of predictions) {
          const rawName = p.className.toLowerCase();
          for (let key in expandedObjectDB) {
            if (rawName.includes(key) && !detectedItems.includes(expandedObjectDB[key])) {
              detectedItems.push(expandedObjectDB[key]);
            }
          }
        }
        if (detectedItems.length > 0) {
          return `スキャン完了。画面に写っているものは「${detectedItems.join('、または')}」です。`;
        } else {
          return `アナライズ完了。対象物は「${predictions[0].className.split(',')[0]}」と識別されました。`;
        }
      }
      return "対象物を明確に検出できませんでした。";
    }

    // 日英翻訳処理
    async function translateText(textToTranslate, targetLang = 'en') {
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(textToTranslate)}&langpair=ja|${targetLang}`);
        const data = await res.json();
        if (data && data.responseData) {
          return data.responseData.translatedText;
        }
      } catch (e) {}
      return null;
    }

    // 音声発話処理（文字表示より前に音声発声を先行開始）
    function speakResponse(replyText, speakLang = 'ja-JP') {
      window.speechSynthesis.cancel();
      isSpeaking = true;

      // 喋る前に一時停止しピコン音・誤検知を完全ガード
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }

      const utterance = new SpeechSynthesisUtterance(replyText);
      if (speakLang === 'ja-JP' && availableVoices.length > 0) {
        utterance.voice = availableVoices[currentVoiceIndex] || null;
      }
      utterance.lang = speakLang;
      utterance.pitch = speechPitch;
      utterance.rate = 1.0;

      // テキスト表示と通知を先行/同時処理
      statusText.innerText = `J.A.R.V.I.S.: 「${replyText}」`;
      sendActiveNotification(replyText);

      utterance.onend = () => {
        isSpeaking = false;
        if (isListening && recognition) {
          setTimeout(() => { try { recognition.start(); } catch(e) {} }, 400);
        }
      };

      utterance.onerror = () => {
        isSpeaking = false;
        if (isListening && recognition) {
          setTimeout(() => { try { recognition.start(); } catch(e) {} }, 400);
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    // 3. 音声コマンド解析と実行
    async function processCommand(input) {
      const text = input.toLowerCase();

      // タイトル画面でのデバイス音声選択
      if (titleScreen.style.display !== 'none') {
        if (text.includes("スマホ") || text.includes("スマートフォン")) {
          selectDevice("スマホ");
          return;
        } else if (text.includes("タブレット")) {
          selectDevice("タブレット");
          return;
        } else if (text.includes("pc") || text.includes("ピーシー") || text.includes("パソコン")) {
          selectDevice("PC");
          return;
        }
      }

      let reply = "";

      // 翻訳コマンド
      if (text.includes("翻訳") || text.includes("英語で") || text.includes("英語にし")) {
        const query = text.replace(/(を英語にして|を英語に翻訳して|英語で|を翻訳して|って英語でなんていうの|って英語で何て言うの|翻訳|英語)/g, "").trim();
        if (query) {
          statusText.innerText = `「${query}」を翻訳中...`;
          const translated = await translateText(query, 'en');
          if (translated) {
            reply = `「${query}」の英語訳は "${translated}" です、${getTitle()}。`;
            speakResponse(reply, 'ja-JP');
            return;
          } else {
            reply = `翻訳処理に失敗いたしました、${getTitle()}。`;
          }
        }
      }
      // ファイル操作コマンド
      else if (text.includes("ファイル") && (text.includes("開") || text.includes("選択") || text.includes("表示"))) {
        triggerFileInput();
        reply = `ファイル選択ダイアログを開きます、${getTitle()}。`;
      } else if (text.includes("ファイル") && (text.includes("消") || text.includes("閉") || text.includes("非表示"))) {
        closeInScreen();
        reply = `ファイルを閉じました、${getTitle()}。`;
      }
      // ライト操作コマンド
      else if (text.includes("ライト") || text.includes("フラッシュ")) {
        if (text.includes("つけ") || text.includes("オン") || text.includes("点灯")) {
          const success = await setTorch(true);
          reply = success ? `カメラライトを点灯しました、${getTitle()}。` : `ライト制御に対応していないか、インカメラ選択中です。`;
        } else if (text.includes("消") || text.includes("オフ")) {
          await setTorch(false);
          reply = `ライトを消灯いたしました、${getTitle()}。`;
        }
      }
      // 声変更
      else if (text.includes("声を変え") || text.includes("声変更")) {
        switchVoice();
        return;
      }
      // 画面表示消去
      else if (text.includes("画面消") || text.includes("画面閉") || text.includes("閉じて") || text.includes("非表示")) {
        closeInScreen();
        reply = `画面表示を終了いたしました、${getTitle()}。`;
      }
      // カメラAI画像解析
      else if (text.includes("これ何") || text.includes("これなに") || text.includes("映ってる") || text.includes("何が見える")) {
        try {
          reply = await analyzeCurrentView();
          reply += ` ${getTitle()}。`;
        } catch (e) {
          reply = `解析中にエラーが発生しました、${getTitle()}。`;
        }
      }
      // キャプチャ
      else if (text.includes("キャプチャ") || text.includes("スクショ") || text.includes("写真撮")) {
        takeScreenshot();
        reply = `画面のキャプチャを完了し保存いたしました、${getTitle()}。`;
      }
      // 録画
      else if (text.includes("録画")) {
        if (text.includes("開始") || text.includes("して") || text.includes("スタート")) {
          reply = startRecording() ? `録画を開始いたしました、${getTitle()}。` : `録画を開始できませんでした。`;
        } else if (text.includes("停止") || text.includes("ストップ") || text.includes("終了")) {
          reply = stopRecording() ? `録画を停止し保存いたしました、${getTitle()}。` : `現在録画は実行されていません。`;
        }
      }
      // 名前記憶
      else if (text.includes("名前は") || text.includes("呼んで")) {
        let nameMatch = text.match(/(?:名前は|と呼んで|呼んで)(.+?)(?:だよ|です|にして|$)/);
        if (nameMatch && nameMatch[1]) {
          userName = nameMatch[1].replace(/僕の|私の|は|と/g, '').trim();
          localStorage.setItem('jarvis_userName', userName);
          reply = `お名前を「${userName}」として登録いたしました、${userName}様。`;
        }
      }
      // バッテリー
      else if (text.includes("充電") || text.includes("バッテリー") || text.includes("電池")) {
        if ('getBattery' in navigator) {
          const battery = await navigator.getBattery();
          const level = Math.round(battery.level * 100);
          reply = `現在のバッテリー残量は ${level}% です、${getTitle()}。`;
        }
      }
      // 天気
      else if (text.includes("天気") || text.includes("予報")) {
        try {
          const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&current_weather=true");
          const data = await response.json();
          reply = `現在の気温は ${Math.round(data.current_weather.temperature)} 度、天気は ${parseWeatherCode(data.current_weather.weathercode)} です、${getTitle()}。`;
        } catch (e) {}
      }
      // WEBアクセス＆検索
      else if (text.includes("開いて") || text.includes("アクセス")) {
        if (text.includes("youtube")) { openInScreen("https://www.youtube.com"); reply = `YouTubeを表示しました。`; }
        else if (text.includes("google")) { openInScreen("https://www.google.com/search?igu=1"); reply = `Googleを表示しました。`; }
        else {
          const target = text.replace(/(を開いて|にアクセスして|アクセス)/g, "").trim();
          openInScreen(`https://www.google.com/search?q=${encodeURIComponent(target)}&igu=1`);
          reply = `${target} の検索結果を表示しました。`;
        }
      } else if (text.includes("教えて") || text.includes("とは") || text.includes("検索")) {
        const query = text.replace(/(について教えて|とは|で検索|を検索|教えて)/g, "").trim();
        if (query) {
          openInScreen(`https://www.google.com/search?q=${encodeURIComponent(query)}&igu=1`);
          reply = `${query} についての検索結果を画面上に表示しました、${getTitle()}。`;
        }
      }
      // 時刻・日付
      else if (text.includes("時間") || text.includes("今何時")) {
        const now = new Date();
        reply = `現在は${now.getHours()}時${now.getMinutes()}分です、${getTitle()}。`;
      } else if (text.includes("日") || text.includes("今日") || text.includes("日付")) {
        const now = new Date();
        reply = `本日は${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日です、${getTitle()}。`;
      }
      // カメラ切替
      else if (text.includes("カメラ")) {
        const nextMode = (text.includes("イン") || text.includes("前")) ? 'user' : 'environment';
        initCamera(nextMode);
        reply = `カメラを切り替えました、${getTitle()}。`;
      }
      // コアの光
      else if (text.includes("光") || text.includes("コア")) {
        if (text.includes("消") || text.includes("オフ")) { coreLight.classList.add('off'); reply = `コアの発光を停止しました。`; }
        else if (text.includes("つけ") || text.includes("オン")) { coreLight.classList.remove('off'); reply = `コアの発光を再開しました。`; }
      }
      // 呼び出し
      else if (text.includes("ヘイ") || text.includes("hey") || text.includes("ジャービス") || text.includes("jarvis")) {
        reply = `はい、${getTitle()}。何かお手伝いできることはありますか？`;
      }

      if (reply) {
        speakResponse(reply);
      }
    }
  </script>
